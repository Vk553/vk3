<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="cache.manifest">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viking Community // PS4 5.05 HOST</title>
    <style>
        :root {
            --bg: transparent;
            --panel: #1c1c1c;
            --panel-2: #242424;
            --line: #2e2e2e;
            --line-bright: #454545;
            --text: #f5f5f5;
            --muted: #b5b5b5;
            --dim: #828282;
            --accent: #a294ff;
            --red: #ff9b9b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { background: var(--bg); }
        html, body { min-height: 100%; }
        body {
            background-color: transparent;
            background-image: url('../background.webp');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text);
            display: flex;
            flex-direction: column;
            font: 17px/1.4 Consolas, "Liberation Mono", monospace;
            min-height: 100vh;
            overflow-x: hidden;
        }
        a { color: inherit; }

        .app { display: flex; flex: 1 0 auto; flex-direction: column; margin: 0 auto; padding: 14px 26px 12px; width: min(100% - 52px, 1220px); }

        /* Top status bar */
        .bar {
            align-items: center;
            background: rgba(28, 28, 28, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid var(--line-bright);
            display: flex;
            font-size: 14px;
            justify-content: space-between;
            letter-spacing: .1em;
            padding: 10px 16px;
            text-transform: uppercase;
        }
        .bar b { color: var(--accent); font-weight: 400; }
        .bar-fw { color: var(--dim); }
        .bar-fw::before { color: var(--accent); content: "\25CF "; }

        .layout { display: flex; flex: 1 0 auto; flex-direction: column; padding: 20px 0 0; }

        /* Header */
        .kicker { color: var(--accent); font-size: 14px; letter-spacing: .14em; margin: 0 0 12px; }
        h1 { font-size: clamp(34px, 5vw, 56px); font-weight: 400; letter-spacing: -.07em; line-height: 1; margin: 0; }
        h1 em { color: var(--accent); font-style: normal; }
        .sub { color: var(--muted); font-size: 17px; margin: 13px 0 0; max-width: 720px; }
        .boot { color: var(--dim); font-size: 14px; list-style: none; margin: 12px 0 0; }
        .boot li { margin: 3px 0; }
        .boot b { color: var(--accent); font-weight: 400; }

        /* Status */
        .status {
            background: rgba(28, 28, 28, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid var(--line);
            margin-top: 20px;
            padding: 14px 16px;
        }
        #progress { margin: 0; padding: 0; }
        #msgs2 {
            border-left: 2px solid var(--accent);
            color: var(--accent);
            font-size: 17px;
            line-height: 1.45;
            min-height: 24px;
            padding: 4px 10px;
        }
        #msgs2 h1, #msgs h1 { color: var(--text) !important; font-size: 16px; font-weight: 400; line-height: 1.45; margin: 0; }
        #menu { display: none; }
        #msgs { border-left: 2px solid var(--accent); color: var(--text); font-size: 16px; line-height: 1.45; min-height: 24px; padding: 4px 10px; }

        /* Controls */
        .controls { background: rgba(28, 28, 28, 0.7); backdrop-filter: blur(10px); border: 1px solid var(--line); margin-top: 14px; padding: 14px; }
        .section-title {
            border-bottom: 1px solid var(--line);
            color: var(--muted);
            font-size: 14px;
            letter-spacing: .12em;
            margin-bottom: 11px;
            padding: 0 4px 10px;
            text-transform: uppercase;
        }
        .grid-goldhen { display: grid; gap: 8px; grid-template-columns: repeat(2, minmax(0, 1fr)); margin-bottom: 14px; }
        .grid { display: grid; gap: 8px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
        .grid-goldhen button,
        .grid button {
            background: var(--panel);
            border: 1px solid var(--line-bright);
            color: var(--text);
            cursor: pointer;
            font: inherit;
            min-height: 48px;
            padding: 10px 14px;
            text-align: left;
        }
        .grid-goldhen button:hover, .grid-goldhen button:focus,
        .grid button:hover, .grid button:focus {
            background: var(--panel-2);
            border-color: var(--accent);
            color: var(--accent);
            outline: 0;
        }
        .grid-goldhen button:focus, .grid button:focus { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }

        /* Footer */
        .foot {
            border-top: 1px solid var(--line);
            color: var(--dim);
            font-size: 13px;
            margin-top: 16px;
            padding: 12px 4px 2px;
            text-align: center;
        }
        .foot a { color: var(--muted); }
        .foot a:hover, .foot a:focus { color: var(--accent); }

        @media (max-width: 820px) {
            body { overflow: auto; }
            .app { padding: 8px 10px; width: min(100% - 20px, 560px); }
            .bar { font-size: 12px; padding: 8px 12px; }
            .layout { padding-top: 14px; }
            h1 { font-size: 38px; }
            .sub { font-size: 16px; }
            .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .grid-goldhen { grid-template-columns: 1fr; }
        }

        @media (max-width: 430px) {
            .grid { grid-template-columns: 1fr; }
            h1 { font-size: 34px; }
        }
    </style>
    <script src="exploit.js"></script>
</head>

    <script>
        function success() {
            document.getElementById("menu").style.display = "block";
            document.getElementById("progress").style.display = "none";
            document.getElementById("controls").style.display = "block";
        }

        function allset() {
            msgs.innerHTML = LoadedMSG;
        }

        var payloadBusy = false;
        function load_payload() {
            if (payloadBusy) return;
            payloadBusy = true;
            req1 = null;
            var req1 = new XMLHttpRequest();
            req1.open('GET', PLfile); req1.responseType = "arraybuffer"; req1.timeout = 15000;
            req1.ontimeout = function () { payloadBusy = false; msgs.innerHTML = "Payload request timed out. Reload the host before retrying."; };
            req1.onerror = function () { payloadBusy = false; msgs.innerHTML = "Payload request failed. Check the cached host files."; };
            req1.send();
            req1.onreadystatechange = function () {
                if (req1.readyState == 4) {
                    if (req1.status != 200 || !req1.response || !req1.response.byteLength) {
                        payloadBusy = false;
                        msgs.innerHTML = "Payload file is unavailable. Do not continue.";
                        return;
                    }
                    var padding1 = new Uint8Array(4 - (req1.response.byteLength % 4) % 4);
                    var tmp1 = new Uint8Array(req1.response.byteLength + padding1.byteLength);
                    tmp1.set(new Uint8Array(req1.response), 0);
                    tmp1.set(padding1, req1.response.byteLength);
                    var shellcode1 = new Uint32Array(tmp1.buffer);
                    var code_addr1 = new int64(0x26100000, 0x00000009);
                    p.syscall(477, code_addr1, 0x300000, 7, 0x41000, -1, 0);
                    for (var i = 0; i < shellcode1.length; i++) {
                        p.write4(code_addr1.add32(0x100000 + i * 4), shellcode1[i]);
                    }
                    runPAYLOAD1 = function () {
                        p.fcall(code_addr1);
                        PLfile = null;
                        for (var x = 0; x < 0x300000; x += 8) {
                            p.write8(code_addr1.add32(x), 0);
                        } setTimeout(allset, 50);
                    };
                    setTimeout(runPAYLOAD1, 100);
                }
            };
        }

        function load_goldhen18() {

            PLfile = "goldhen.bin";
